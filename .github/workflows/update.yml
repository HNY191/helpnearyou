# Twice a day: early morning (so today's hours are fresh before places open) and at night.
name: Twice-daily update
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update listings and rebuild the site
        run: python update.py
      - name: Save the changes
        run: |
          git config user.name "hny-nightly"
          git config user.email "hny-nightly@users.noreply.github.com"
          git add data.json state status
          if ! git diff --cached --quiet; then git commit -m "Update $(date -u +%F\ %H:%M) UTC" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
