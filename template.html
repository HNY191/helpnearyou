  --accent:#1E4FB8; --accent-ink:#FFFFFF; --accent-soft:#E2ECFF; --accent-deep:#163C8C;
  --crisis:#8A1C3F; --crisis-soft:#FBE9EF; --crisis-line:#EBCFD9; --crisis-ink:#FFFFFF;
  --safe:#6E2C6E; --safe-soft:#F4ECF4;
  --open:#145A30; --open-soft:#DDF2E6; --closed:#3D4652; --closed-soft:#ECEFF3; --warn:#7A4A00; --warn-soft:#FFF1D6;
  --dark-band:#17202A; --dark-band-ink:#FFFFFF;
  --mixp:100%;
  --font:'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --fg:#E9EDF2; --muted:#B2BBC6; --faint:#9AA4B0; --line:#2C3540; --line2:#3A4552;

  --dark-band:#05070A; --dark-band-ink:#FFFFFF; --mixp:55%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --fg:#E9EDF2; --muted:#B2BBC6; --faint:#9AA4B0; --line:#2C3540; --line2:#3A4552;
  --accent:#3B6FD8; --accent-ink:#FFFFFF; --accent-soft:#1E2E4F; --accent-deep:#A9C3FA;
  --crisis:#B23A62; --crisis-soft:#2E1A22; --crisis-line:#4D2A37; --crisis-ink:#FFFFFF;

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 32px}
button,input,select{font:inherit;color:inherit}
select{color:var(--fg);background-color:var(--surface)}
select option{color:var(--fg);background-color:var(--surface)}
.where select{color:var(--fg)!important}
a{color:var(--accent-deep)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:14px 10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer}
.logo .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.logo b{font-size:21px;letter-spacing:-.2px}
.spacer{flex:1}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.pill small{font-weight:400;color:var(--muted)}
.where{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.where select,.where input{min-height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);padding:0 14px;font-weight:700;max-width:100%}
.where input{width:6.5em;font-weight:400}
@media (max-width:699px){.where{order:3;width:100%;flex-wrap:nowrap}.where .pill{flex:1;min-width:0}.where select{min-width:0;flex:1}#lang small{display:none}}
.sched{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.crisisbar{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--crisis);color:var(--crisis-ink);border:0;width:100%;text-align:left;cursor:pointer}
.crisisbar .ic{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0}
.crisisbar strong{font-size:18px;display:block}
.crisisbar span span{font-size:14px;opacity:.92}
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line2)}
.search input{border:0;outline:none;flex:1;min-width:0;background:transparent;font-size:17px}
.stack{display:flex;flex-direction:column;gap:12px}
.h2{font-size:19px;font-weight:700;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.tiles{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;padding:10px 6px;font-weight:700;font-size:15px;line-height:1.2;text-align:center}
.tile:hover{border-color:var(--line2)}
.ci{width:42px;height:42px;border-radius:21px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) var(--mixp),var(--fg));flex-shrink:0}
.note{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--closed-soft);font-size:15px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--faint);padding-top:6px}
.bar{display:flex;align-items:center;gap:8px;padding-block:6px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.iconbtn.crisis{background:var(--crisis);color:var(--crisis-ink)}
.title{flex:1;min-width:0}
.title h1{font-size:22px}
.title div{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.sel{border:2px solid var(--accent)}
.card[data-card]{cursor:pointer}
.card[data-card]:hover{border-color:var(--line2)}
details.hrs{padding:6px 12px;border-radius:12px;background:var(--bg);border-color:var(--line)}
details.hrs summary{min-height:36px;font-size:15px}
.card .name{font-size:19px;font-weight:700;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dist{font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.desc{font-size:15px;color:var(--muted)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.badge{padding:3px 10px;border-radius:12px;font-size:14px;font-weight:700;background:var(--closed-soft);color:var(--closed)}
.badge.open{background:var(--open-soft);color:var(--open)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--accent);background:var(--surface);color:var(--accent-deep);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;padding:0 12px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.crisis{background:var(--crisis);border-color:var(--crisis);color:var(--crisis-ink)}
.btn.safe{background:var(--safe);border-color:var(--safe);color:#fff}
.btn.ghost{border-color:var(--line2);color:var(--fg)}
.small{font-size:13px;color:var(--faint)}
.num{font-weight:700;user-select:all}
.hours{display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.hours .today{font-weight:700}
.hours span:nth-child(even){text-align:right}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
details summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center;gap:12px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";flex-shrink:0;margin-left:auto;width:9px;height:9px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);opacity:.75}
details[open] > summary::after{transform:translateY(2px) rotate(-135deg)}
@media (prefers-reduced-motion:no-preference){details summary::after{transition:transform .15s}}
details ol,details ul{margin:8px 0 4px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.side{flex:1 1 220px;max-width:260px;display:none}
.main{flex:999 1 420px;min-width:0}
.detail{flex:1 1 340px;max-width:420px;min-width:0;display:none}
@media (min-width:1000px){
  .wide .side{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
  .wide .detail{display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding-right:4px}
  .wide .main .back{display:none}
}
.sidebtn{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:15px}
.sidebtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}
.sidebtn .ci{width:30px;height:30px}
.qr{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--bg)}
.qr .code{background:#fff;padding:6px;border-radius:8px;flex-shrink:0;line-height:0}
.qr .code svg{width:120px;height:120px}
.crisis-page{background:var(--crisis-soft);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.line{background:var(--surface);border:1px solid var(--crisis-line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.line h3{font-size:17px}
.band{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--dark-band);color:var(--dark-band-ink)}
.band .btn{background:#fff;color:#17202A;border-color:#fff;min-height:44px}
.exitbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding-block:10px;background:var(--bg)}
.exit{min-height:48px;padding:0 20px;border-radius:24px;border:0;background:var(--dark-band);color:var(--dark-band-ink);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--muted)}
.banner{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.chip{transition:border-color .15s,background .15s}}
</style>

/* ---------------- time and distance ---------------- */
const DAYS=["sun","mon","tue","wed","thu","fri","sat"];
const DN={en:{mon:"Mon",tue:"Tue",wed:"Wed",thu:"Thu",fri:"Fri",sat:"Sat",sun:"Sun"},es:{mon:"Lun",tue:"Mar",wed:"Mié",thu:"Jue",fri:"Vie",sat:"Sáb",sun:"Dom"}};
const DNAME=new Proxy({}, {get:(_,k)=>(DN[S.lang]||DN.en)[k]});
function nowNY(){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
  const g=k=>p.find(x=>x.type===k).value;
  return {d:DAYS.indexOf(g("weekday").toLowerCase().slice(0,3)), m:(+g("hour"))*60+(+g("minute"))};
}
const mins = s => { const [h,m]=s.split(":").map(Number); return h*60+m; };
function fmt(s){ let [h,m]=s.split(":").map(Number); if(h===24) h=0; const ap=h<12?"AM":"PM"; const hh=h%12||12; return m?`${hh}:${String(m).padStart(2,"0")} ${ap}`:`${hh} ${ap}`; }
const hasHours = x => !!x.hours && Object.values(x.hours).some(v=>v && v.length);
function status(x){
  const tx=(x.hours_text||"")+" "+(x.tags||[]).join(" ");
  if(/24\/7|24 hours|24-hour/i.test(tx) && !x.hours) return {open:true,txt:t("open24")};
  const h=x.hours; if(!hasHours(x)){ const note=x.schedule_note || (x.hours_text && !/call for hours/i.test(x.hours_text)? x.hours_text : ""); return {open:null,txt:note? (S.lang==="es"?"Ver horario":"See schedule") : t("callHours"), note}; }
  const n=nowNY(), today=h[DAYS[n.d]]||[];
  for(const [a,b] of today){ const A=mins(a), B=b==="24:00"?1440:mins(b); if(A===0 && B===1440) return {open:true,txt:t("open24")}; if(n.m>=A && n.m<B) return {open:true,txt:`${t("openUntil")} ${fmt(b)}`}; }
  for(let i=0;i<8;i++){ const d=(n.d+i)%7, sl=(h[DAYS[d]]||[]).filter(([a])=> i>0 || mins(a)>n.m);
    if(sl.length) return {open:false,txt:`${t("closedOpens")} ${i===0?t("today"):DNAME[DAYS[d]]} ${fmt(sl[0][0])}`}; }
  return {open:false,txt:t("closed")};
}
function miles(x){
  const o=[S.loc.lat,S.loc.lng]; if(x.lat==null) return null;
  const R=3958.8,r=Math.PI/180,dl=(x.lat-o[0])*r,dg=(x.lng-o[1])*r;
  const a=Math.sin(dl/2)**2+Math.cos(o[0]*r)*Math.cos(x.lat*r)*Math.sin(dg/2)**2; return 2*R*Math.asin(Math.sqrt(a));
}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], MON_ES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function when(s){ const m=String(s||"").match(/^(\d{4})-(\d\d)-(\d\d)/); if(!m) return s||"";

const mi = d => d==null? "" : d<0.5? (S.lang==="es"?"a menos de 1 mi":"under 1 mi") : `${d<10? d.toFixed(1): Math.round(d)} mi`;

function listFor(cat){
  const c=catOf(cat); let L=DATA.listings.filter(x=>x.cats.some(k=>c.cats.includes(k)));
  if(S.chips.has("open")) L=L.filter(x=>status(x).open===true);
  for(const ch of S.chips) if(ch!=="open") L=L.filter(x=>(x.tags||[]).includes(ch));
  L.forEach(x=>x._d=miles(x));
  // county offices (social services, veterans, county health) only serve their own county
  const near=x=> inCounty(x) || (x._d<=30 && !/county|dept\.? of (social|human)|department of (social|human)/i.test(x.name));
  const seen=new Set(), once=x=>{ const k=(x.name+"|"+firstPhone(x.phone)).toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; };
  const local=L.filter(x=>x._d!=null && near(x)).sort((a,b)=>a._d-b._d).filter(once);
  const wide=L.filter(x=>x._d==null && inCounty(x)).filter(once), state=L.filter(x=>x.county==="statewide").filter(once);
  const far = (!local.length && !wide.length) ? L.filter(x=>x._d!=null && x.county!=="statewide").sort((a,b)=>a._d-b._d).filter(once).slice(0,5) : [];
  return {local,wide,state,far};
}
function chipsFor(cat){

}

function reportText(x,r){ return `Help Near You report\nPlace: ${x.name} (${x.id})\nProblem: ${(ISSUES.find(i=>i[0]===r.issue)||[])[1]||r.issue}\nNote: ${r.note||"-"}`; }
async function sendReport(x,r){

function quickExit(){
  S.view="decoy"; S.q=""; S.chips.clear(); S.id=null; app.innerHTML=decoy();
  try{ window.location.replace("https://www.weather.gov/"); }catch(e){}
}
app.addEventListener("click",e=>{
  const cardEl=e.target.closest("[data-card]");
  if(cardEl && !e.target.closest("a,button,summary,details,input,textarea")){
    S.id=cardEl.dataset.card; if(matchMedia("(min-width:1000px)").matches && S.view==="list") return render(); return go("place");
  }
  const b=e.target.closest("button,[data-go]"); if(!b) return;
  if(b.id==="exit") return quickExit();
  if(b.id==="install" && installEvt){ installEvt.prompt(); installEvt=null; return; }
  if(b.id==="lang"){ S.lang=S.lang==="en"?"es":"en"; return render(); }
  if(b.id==="geo"){
    if(!navigator.geolocation){ S.msg="Location isn't available on this device. Type your ZIP code instead."; return render(); }
    b.disabled=true; b.textContent=S.lang==="es"?"Buscando...":"Finding you...";
    navigator.geolocation.getCurrentPosition(p=>{ const z=nearestZip(p.coords.latitude,p.coords.longitude), v=DATA.zips[z]; setLoc(v[0],v[1],p.coords.latitude,p.coords.longitude); S.view=S.back||"home"; render(); },
      ()=>{ S.msg = S.lang==="es"?"No se pudo usar tu ubicación aquí. Escribe tu código postal o elige tu condado.":"Couldn't use your location here. Type your ZIP code or pick your county."; render(); },{timeout:10000,maximumAge:600000});
    return;
  }
  if(b.dataset.county){ S.pick=b.dataset.county; return render(); }
  if(b.dataset.whole){ const ts=DATA.counties[b.dataset.whole]; const lat=ts.reduce((a,t)=>a+t[1],0)/ts.length, lng=ts.reduce((a,t)=>a+t[2],0)/ts.length; setLoc(countyLabel(b.dataset.whole),b.dataset.whole,lat,lng); S.pick=null; S.view=S.back||"home"; return render(); }
  if(b.dataset.town){ const t0=DATA.counties[S.pick].find(t=>t[0]===b.dataset.town); setLoc(t0[0],S.pick,t0[1],t0[2]); S.pick=null; S.view=S.back||"home"; return render(); }
  if(b.dataset.go==="where-back"){ S.pick=null; return render(); }
  if(b.dataset.go==="where"){ S.back = (S.view==="where")?S.back:(S.view==="list"?"list":"home"); S.pick=null; S.msg=""; S.view="where"; return render(); }
  if(b.dataset.report){ S.rep={id:b.dataset.report,open:true}; return keep(); }
  if(b.hasAttribute("data-report-cancel")){ S.rep=null; return keep(); }
  if(b.dataset.issue){ const n=document.getElementById("repnote"); S.rep.note=n?n.value:""; S.rep.issue=b.dataset.issue; return keep(); }
  if(b.dataset.cat){ S.chips.clear(); S.id=null; if(b.dataset.cat==="safety"){ S.view="safety"; return render(); } S.cat=b.dataset.cat; S.view="list"; return render(); }
  if(b.dataset.chip){ const c=b.dataset.chip; S.chips.has(c)?S.chips.delete(c):S.chips.add(c); return render(); }
  if(b.dataset.id){ S.id=b.dataset.id; if(matchMedia("(min-width:1000px)").matches && S.view==="list") return render(); return go("place"); }
  if(b.dataset.go){ const v=b.dataset.go; if(v==="list"&&!S.cat) return go("home"); return go(v); }
});

app.addEventListener("input",e=>{
  if(e.target.id==="zip" && e.target.value.length===5){ if(useZip(e.target.value)) render(); else { S.back=S.view==="list"?"list":"home"; S.view="where"; render(); } }
});
app.addEventListener("submit",async e=>{ e.preventDefault();
  if(e.target.id==="repform"){ const r=S.rep, x=byId[e.target.dataset.id]; if(!r||!r.issue||r.sending) return; r.note=document.getElementById("repnote").value; r.sending=true; keep();
    r.done=await sendReport(x,r); r.sending=false; return keep(); }
  if(e.target.id==="zform"){ const z=document.getElementById("zip2").value.trim(); if(useZip(z)){ S.view=S.back||"home"; } render(); return; }
  const q=document.getElementById("q"); S.q=q?q.value:""; if(S.q.trim()) go("results"); });
let escCount=0; document.addEventListener("keydown",e=>{ if(e.key==="Escape" && S.view==="safety") quickExit(); });
render();
</script>
